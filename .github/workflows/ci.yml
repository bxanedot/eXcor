name: CI

on:
  push:
    # Hourly scoreboard JSON commits are not source changes; do not rebuild every platform.
    branches-ignore:
      - automation/excor-competitiveness
  pull_request:

env:
  GRADLE_ARGS: -Porg.gradle.java.installations.fromEnv=JAVA_HOME_27_X64,JAVA_HOME_27_ARM64 --stacktrace

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check evidence score contract
        run: python3 -m unittest discover -s scripts/tests -p test_competitiveness_score.py -v
      - name: Check black-box comparison report contract
        run: python3 -m unittest discover -s samples/black-box-comparison/tests -p 'test_*.py' -v
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            27
            21
      - run: ./gradlew $GRADLE_ARGS :jvmTest :jvmJar :assembleAndroidMain
      # Installability: publish every publication locally (this also compiles the shared metadata, which no platform
      # build does), then build a standalone consumer that follows the README's installation steps.
      - run: ./gradlew $GRADLE_ARGS publishToMavenLocal
      - run: ./gradlew $GRADLE_ARGS -p samples/jvm-quickstart build
      # Known vulnerabilities (OSV) in what ships: the published variants' runtime dependencies fail the build. Build
      # tooling (Android lint) and test-only dependencies are reported without failing. The lockfile exists only for
      # this step; normal builds don't lock.
      - name: Dependency vulnerability scan
        run: |
          printf 'rootProject { dependencyLocking { lockAllConfigurations() } }\n' > "$RUNNER_TEMP/lock.gradle"
          ./gradlew $GRADLE_ARGS -q --init-script "$RUNNER_TEMP/lock.gradle" :dependencies --write-locks > /dev/null
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" https://github.com/google/osv-scanner/releases/download/v2.0.0/osv-scanner_linux_amd64
          echo "b60c273474aecad1158cfe1e9828f3841483701ba0fe3560517a45b2db16e84c  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          mkdir -p "$RUNNER_TEMP/shipped"
          grep -E '=(.*,)?(jvmRuntimeClasspath|androidRuntimeClasspath|ios(Arm64|SimulatorArm64|X64)CompileKlibraries)(,|$)' gradle.lockfile > "$RUNNER_TEMP/shipped/gradle.lockfile"
          echo "All configurations, report only:"
          "$RUNNER_TEMP/osv-scanner" scan source --lockfile gradle.lockfile || true
          echo "Shipped runtime dependencies, gating:"
          "$RUNNER_TEMP/osv-scanner" scan source --lockfile "$RUNNER_TEMP/shipped/gradle.lockfile"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            27
            21
      - run: ./gradlew $GRADLE_ARGS :jvmTest :jvmJar :assembleAndroidMain
        shell: bash
      # The desktop preview as a Windows app: a folder with "eXcor Preview.exe" and its own Java runtime, plus an
      # installer when the runner has the WiX toolset jpackage needs for one.
      - run: ./gradlew $GRADLE_ARGS :preview-desktop:packageApp
        shell: bash
      - name: Windows preview passes its self-test
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "self-test.txt"
          Start-Process -Wait -FilePath "preview-desktop/build/app/eXcor Preview/eXcor Preview.exe" -ArgumentList "--self-test", "`"$report`""
          Get-Content $report
          if (-not (Select-String -Path $report -Pattern "eXcor Preview OK" -Quiet)) { exit 1 }
      - name: Windows installer (when WiX is available)
        shell: bash
        run: |
          if command -v candle.exe > /dev/null || command -v wix.exe > /dev/null || ls -d "/c/Program Files (x86)"/WiX* > /dev/null 2>&1; then
            ./gradlew $GRADLE_ARGS :preview-desktop:packageApp -PpreviewPackageType=exe
          else
            echo "::notice::No WiX toolset on this runner; the portable app folder is the Windows build."
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: excor-preview-windows
          path: |
            preview-desktop/build/app/
            preview-desktop/build/installer/*.exe
          if-no-files-found: error

  # The preview apps, for trying the library by hand: the Android APK (uploaded as an artifact), and the desktop app,
  # which must package, pass its self-test and start.
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            27
            21
      - run: ./gradlew $GRADLE_ARGS :preview-android:assembleDebug :preview-android:lintDebug :preview-desktop:packageApp
      - name: Desktop preview passes its self-test and starts
        run: |
          app="preview-desktop/build/app/eXcor Preview/bin/eXcor Preview"
          "$app" --self-test "$RUNNER_TEMP/self-test.txt"
          grep -q "eXcor Preview OK" "$RUNNER_TEMP/self-test.txt"
          set +e
          timeout 30 xvfb-run -a "$app" > "$RUNNER_TEMP/desktop.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/desktop.log"
          # 124: still running when the timeout stopped it, so it started and did not crash.
          [ "$result" -eq 124 ] && ! grep -q Exception "$RUNNER_TEMP/desktop.log"
      - run: cp preview-android/build/outputs/apk/debug/preview-android-debug.apk excor-preview.apk
      # A debug build signed with this run's throwaway key, for trying the library on a phone.
      - uses: actions/upload-artifact@v7
        with:
          name: excor-preview-apk
          path: excor-preview.apk

  android-device:
    runs-on: ubuntu-latest
    # An emulator that never boots would otherwise hold the runner for hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            27
            21
      - run: ./gradlew $GRADLE_ARGS :preview-android:assembleDebug :preview-android:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot an API ${{ matrix.api }} emulator
        run: |
          image="system-images;android-${{ matrix.api }};default;x86_64"
          adb=$ANDROID_HOME/platform-tools/adb
          # The runner sets XDG_CONFIG_HOME, which avdmanager follows and the emulator does not; one AVD folder for both.
          export ANDROID_AVD_HOME=$HOME/.android/avd
          mkdir -p "$ANDROID_AVD_HOME"
          # One retry: a download cut short ("Error reading Zip content") fails the install, not the test.
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install emulator "$image" || $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install emulator "$image"
          echo no | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd -n check -k "$image"
          $ANDROID_HOME/emulator/emulator -avd check -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect &
          # Under the timeout too, so an emulator that exits fails the step instead of holding it to the job limit.
          timeout 600 sh -c "$adb wait-for-device && until [ \"\$($adb shell getprop sys.boot_completed | tr -d '\r')\" = 1 ]; do sleep 5; done"
      - name: Preview app starts and opens a shared link on the API ${{ matrix.api }} emulator
        run: |
          adb=$ANDROID_HOME/platform-tools/adb
          $adb install -r preview-android/build/outputs/apk/debug/preview-android-debug.apk
          $adb shell am start -W -n com.excor.preview/.MainActivity
          # A shared link reaches the running screen and loads the video's details.
          $adb shell am start -W -a android.intent.action.SEND -t text/plain --es android.intent.extra.TEXT https://youtu.be/dQw4w9WgXcQ -n com.excor.preview/.MainActivity
          sleep 15
          # Still running, and nothing in the crash log.
          $adb shell pidof com.excor.preview
          $adb logcat -d -b crash > crash.txt
          if grep -q com.excor.preview crash.txt; then cat crash.txt; exit 1; fi
      # Downloads join YouTube's separate picture and sound on the phone with MediaExtractor and MediaMuxer. JoinCheck
      # joins synthetic clips with this emulator's own media stack and checks every sample arrives.
      - name: Picture and sound join on the API ${{ matrix.api }} emulator
        run: |
          adb=$ANDROID_HOME/platform-tools/adb
          $adb install -r preview-android/build/outputs/apk/androidTest/debug/preview-android-debug-androidTest.apk
          $adb shell am instrument -w com.excor.preview.test/com.excor.preview.JoinCheck | tee join-check.txt
          grep -q "result=ok" join-check.txt

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            27
            21
      - name: Kotlin tests, iOS targets, frameworks and XCFramework
        run: >
          ./gradlew $GRADLE_ARGS :jvmTest :iosSimulatorArm64Test
          :linkReleaseFrameworkIosArm64 :linkReleaseFrameworkIosSimulatorArm64 :linkReleaseFrameworkIosX64
          :assembleEXcorReleaseXCFramework
      - name: Swift check of the published Kotlin API
        run: >
          xcrun --sdk iphonesimulator swiftc -typecheck -target arm64-apple-ios15.0-simulator
          -F build/XCFrameworks/release/eXcor.xcframework/ios-arm64_x86_64-simulator
          apicheck/ExcorApiCheck.swift
      - name: Swift package tests
        shell: bash
        working-directory: swift
        run: |
          set +e
          swift test 2>&1 | tee "$RUNNER_TEMP/swift-test.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            {
              echo '### Swift test failure output'
              echo '```text'
              tail -n 100 "$RUNNER_TEMP/swift-test.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            details=$(tail -n 40 "$RUNNER_TEMP/swift-test.log" | python3 -c 'import sys; print(sys.stdin.read().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"), end="")')
            printf '::error title=Swift test log::%s\n' "$details"
          fi
          exit "$result"
      - name: Swift package iOS Simulator build
        run: xcodebuild -scheme eXcorKit -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
        working-directory: swift
