name: CI

on:
  push:
  pull_request:

env:
  GRADLE_ARGS: -Porg.gradle.java.installations.fromEnv=JAVA_HOME_27_X64,JAVA_HOME_27_ARM64 --stacktrace

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            27
            21
      - run: ./gradlew $GRADLE_ARGS :jvmTest :jvmJar :assembleAndroidMain

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            27
            21
      - run: ./gradlew $GRADLE_ARGS :jvmTest :jvmJar :assembleAndroidMain
        shell: bash

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            27
            21
      - name: Kotlin tests, iOS targets, frameworks and XCFramework
        run: >
          ./gradlew $GRADLE_ARGS :jvmTest :iosSimulatorArm64Test
          :linkReleaseFrameworkIosArm64 :linkReleaseFrameworkIosSimulatorArm64 :linkReleaseFrameworkIosX64
          :assembleEXcorReleaseXCFramework
      - name: Swift check of the published Kotlin API
        run: >
          xcrun --sdk iphonesimulator swiftc -typecheck -target arm64-apple-ios15.0-simulator
          -F build/XCFrameworks/release/eXcor.xcframework/ios-arm64_x86_64-simulator
          apicheck/ExcorApiCheck.swift
