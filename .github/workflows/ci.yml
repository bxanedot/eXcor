name: CI

on:
  push:
  pull_request:

env:
  GRADLE_ARGS: -Porg.gradle.java.installations.fromEnv=JAVA_HOME_27_X64,JAVA_HOME_27_ARM64 --stacktrace

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            27
            21
      - run: ./gradlew $GRADLE_ARGS :jvmTest :jvmJar :assembleAndroidMain
      # Installability: publish every publication locally (this also compiles the shared metadata, which no platform
      # build does), then build a standalone consumer that follows the README's installation steps.
      - run: ./gradlew $GRADLE_ARGS publishToMavenLocal
      - run: ./gradlew $GRADLE_ARGS -p samples/jvm-quickstart build
      # Known vulnerabilities (OSV) in what ships: the published variants' runtime dependencies fail the build. Build
      # tooling (Android lint) and test-only dependencies are reported without failing. The lockfile exists only for
      # this step; normal builds don't lock.
      - name: Dependency vulnerability scan
        run: |
          printf 'rootProject { dependencyLocking { lockAllConfigurations() } }\n' > "$RUNNER_TEMP/lock.gradle"
          ./gradlew $GRADLE_ARGS -q --init-script "$RUNNER_TEMP/lock.gradle" :dependencies --write-locks > /dev/null
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" https://github.com/google/osv-scanner/releases/download/v2.0.0/osv-scanner_linux_amd64
          echo "b60c273474aecad1158cfe1e9828f3841483701ba0fe3560517a45b2db16e84c  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          mkdir -p "$RUNNER_TEMP/shipped"
          grep -E '=(.*,)?(jvmRuntimeClasspath|androidRuntimeClasspath|ios(Arm64|SimulatorArm64|X64)CompileKlibraries)(,|$)' gradle.lockfile > "$RUNNER_TEMP/shipped/gradle.lockfile"
          echo "All configurations, report only:"
          "$RUNNER_TEMP/osv-scanner" scan source --lockfile gradle.lockfile || true
          echo "Shipped runtime dependencies, gating:"
          "$RUNNER_TEMP/osv-scanner" scan source --lockfile "$RUNNER_TEMP/shipped/gradle.lockfile"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            27
            21
      - run: ./gradlew $GRADLE_ARGS :jvmTest :jvmJar :assembleAndroidMain
        shell: bash

  # The apps run on the historical engine in src/ (historical-engine/), quarantined pending the provenance review and
  # not part of the clean-room artifact above; built and tested here so they cannot break unnoticed again.
  apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            27
            21
      - run: >
          ./gradlew $GRADLE_ARGS :historical-engine:jvmTest :app-core:jvmTest
          :android-app:assembleDebug :android-app:lintDebug :desktop-app:distZip
      - name: Desktop app starts
        run: |
          unzip -q desktop-app/build/distributions/desktop-app.zip -d "$RUNNER_TEMP"
          set +e
          JAVA_HOME=$JAVA_HOME_27_X64 timeout 30 xvfb-run -a "$RUNNER_TEMP/desktop-app/bin/desktop-app" > "$RUNNER_TEMP/desktop.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/desktop.log"
          # 124: still running when the timeout stopped it, so it started and did not crash.
          [ "$result" -eq 124 ] && ! grep -q Exception "$RUNNER_TEMP/desktop.log"

  android-device:
    runs-on: ubuntu-latest
    # An emulator that never boots would otherwise hold the runner for hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            27
            21
      - run: ./gradlew $GRADLE_ARGS :historical-engine:assembleAndroidDeviceTest :android-app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: MergeCheck on an API ${{ matrix.api }} emulator
        run: |
          image="system-images;android-${{ matrix.api }};default;x86_64"
          adb=$ANDROID_HOME/platform-tools/adb
          # The runner sets XDG_CONFIG_HOME, which avdmanager follows and the emulator does not; one AVD folder for both.
          export ANDROID_AVD_HOME=$HOME/.android/avd
          mkdir -p "$ANDROID_AVD_HOME"
          # One retry: a download cut short ("Error reading Zip content") fails the install, not the test.
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install emulator "$image" || $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install emulator "$image"
          echo no | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd -n check -k "$image"
          $ANDROID_HOME/emulator/emulator -avd check -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect &
          # Under the timeout too, so an emulator that exits fails the step instead of holding it to the job limit.
          timeout 600 sh -c "$adb wait-for-device && until [ \"\$($adb shell getprop sys.boot_completed | tr -d '\r')\" = 1 ]; do sleep 5; done"
          $adb install -r historical-engine/build/outputs/apk/androidTest/historical-engine-androidTest.apk
          # am instrument exits 0 either way; the report says how it went.
          $adb shell am instrument -w com.excor.historical.test/com.excor.MergeCheck | tee report.txt
          grep -q 'MergeCheck: OK' report.txt
      # Opens no link, so it makes no request beyond the library's background warm-up.
      - name: App starts on the API ${{ matrix.api }} emulator
        run: |
          adb=$ANDROID_HOME/platform-tools/adb
          $adb install -r android-app/build/outputs/apk/debug/android-app-debug.apk
          $adb shell am start -W -n com.excor.android/.MainActivity
          # A shared text reaches the running screen (it fills the link field).
          $adb shell am start -W -a android.intent.action.SEND -t text/plain --es android.intent.extra.TEXT not-a-link -n com.excor.android/.MainActivity
          sleep 10
          # Still running, with the media service the screen connects to, and nothing in the crash log.
          $adb shell pidof com.excor.android
          $adb shell dumpsys activity services com.excor.android | grep -q PlaybackService
          $adb logcat -d -b crash > crash.txt
          if grep -q com.excor.android crash.txt; then cat crash.txt; exit 1; fi
      # A debug build signed with this run's throwaway key, for trying the app on a phone.
      - if: matrix.api == 36
        uses: actions/upload-artifact@v4
        with:
          name: excor-android-debug
          path: android-app/build/outputs/apk/debug/android-app-debug.apk

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            27
            21
      - name: Kotlin tests, iOS targets, frameworks and XCFramework
        run: >
          ./gradlew $GRADLE_ARGS :jvmTest :iosSimulatorArm64Test
          :linkReleaseFrameworkIosArm64 :linkReleaseFrameworkIosSimulatorArm64 :linkReleaseFrameworkIosX64
          :assembleEXcorReleaseXCFramework
      - name: Swift check of the published Kotlin API
        run: >
          xcrun --sdk iphonesimulator swiftc -typecheck -target arm64-apple-ios15.0-simulator
          -F build/XCFrameworks/release/eXcor.xcframework/ios-arm64_x86_64-simulator
          apicheck/ExcorApiCheck.swift
      - name: iOS app build
        run: |
          ./gradlew $GRADLE_ARGS :historical-engine:assembleExcorAppReleaseXCFramework
          brew install xcodegen
          xcodegen generate --spec ios-app/project.yml --project ios-app
          xcodebuild -project ios-app/eXcorIOS.xcodeproj -scheme eXcorIOS -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Swift package tests
        shell: bash
        working-directory: swift
        run: |
          set +e
          swift test 2>&1 | tee "$RUNNER_TEMP/swift-test.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            {
              echo '### Swift test failure output'
              echo '```text'
              tail -n 100 "$RUNNER_TEMP/swift-test.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            details=$(tail -n 40 "$RUNNER_TEMP/swift-test.log" | python3 -c 'import sys; print(sys.stdin.read().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"), end="")')
            printf '::error title=Swift test log::%s\n' "$details"
          fi
          exit "$result"
      - name: Swift package iOS Simulator build
        run: xcodebuild -scheme eXcorKit -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
        working-directory: swift
