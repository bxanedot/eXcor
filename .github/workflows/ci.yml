name: CI

on:
  push:
  pull_request:

# Gradle runs on JDK 21; the build compiles with the JDK 27 toolchain installed next to it.
env:
  GRADLE_ARGS: -Porg.gradle.java.installations.fromEnv=JAVA_HOME_27_X64,JAVA_HOME_27_ARM64 --stacktrace

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            27
            21
      # The runner image ships an Android SDK; AGP fetches a missing platform itself.
      - run: ./gradlew $GRADLE_ARGS jvmTest jvmJar assembleAndroidMain :android-app:lintDebug
        shell: bash

  # ExcorMerge runs on Android's own MediaExtractor and MediaMuxer, so MergeCheck runs on emulators: the
  # library's minimum API and a current one. GitHub's Linux runners offer KVM once its device is opened up.
  # The app is started on the same emulators.
  android-device:
    runs-on: ubuntu-latest
    # An emulator that never boots would otherwise hold the runner for hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            27
            21
      - run: ./gradlew $GRADLE_ARGS assembleAndroidDeviceTest :android-app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: MergeCheck on an API ${{ matrix.api }} emulator
        run: |
          image="system-images;android-${{ matrix.api }};default;x86_64"
          adb=$ANDROID_HOME/platform-tools/adb
          # The runner sets XDG_CONFIG_HOME, which avdmanager follows and the emulator does not; one AVD folder for both.
          export ANDROID_AVD_HOME=$HOME/.android/avd
          mkdir -p "$ANDROID_AVD_HOME"
          # One retry: a download cut short ("Error reading Zip content") fails the install, not the test.
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install emulator "$image" || $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install emulator "$image"
          echo no | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd -n check -k "$image"
          $ANDROID_HOME/emulator/emulator -avd check -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect &
          # Under the timeout too, so an emulator that exits fails the step instead of holding it to the job limit.
          timeout 600 sh -c "$adb wait-for-device && until [ \"\$($adb shell getprop sys.boot_completed | tr -d '\r')\" = 1 ]; do sleep 5; done"
          $adb install -r build/outputs/apk/androidTest/excor-androidTest.apk
          # am instrument exits 0 either way; the report says how it went.
          $adb shell am instrument -w com.bxane.excor.test/com.bxane.excor.MergeCheck | tee report.txt
          grep -q 'MergeCheck: OK' report.txt
      # Opens no link, so it makes no request beyond the library's background warm-up.
      - name: App starts on the API ${{ matrix.api }} emulator
        run: |
          adb=$ANDROID_HOME/platform-tools/adb
          $adb install -r android-app/build/outputs/apk/debug/android-app-debug.apk
          $adb shell am start -W -n com.bxane.excor.android/.MainActivity
          # A shared text reaches the running screen (it fills the link field).
          $adb shell am start -W -a android.intent.action.SEND -t text/plain --es android.intent.extra.TEXT not-a-link -n com.bxane.excor.android/.MainActivity
          sleep 10
          # Still running, with the media service the screen connects to, and nothing in the crash log.
          $adb shell pidof com.bxane.excor.android
          $adb shell dumpsys activity services com.bxane.excor.android | grep -q PlaybackService
          $adb logcat -d -b crash > crash.txt
          if grep -q com.bxane.excor.android crash.txt; then cat crash.txt; exit 1; fi
      # A debug build signed with this run's throwaway key, for trying the app on a phone.
      - if: matrix.api == 36
        uses: actions/upload-artifact@v4
        with:
          name: excor-android-debug
          path: android-app/build/outputs/apk/debug/android-app-debug.apk

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            27
            21
      - name: JVM tests, iOS simulator tests, framework links, XCFramework
        run: ./gradlew $GRADLE_ARGS jvmTest iosSimulatorArm64Test linkReleaseFrameworkIosArm64 linkReleaseFrameworkIosSimulatorArm64 linkReleaseFrameworkIosX64 assembleExcorReleaseXCFramework
      - name: Swift type-check of the public API
        run: >
          xcrun --sdk iphonesimulator swiftc -typecheck -target arm64-apple-ios15.0-simulator
          -F build/XCFrameworks/release/Excor.xcframework/ios-arm64_x86_64-simulator
          apicheck/ApiCheck.swift
